<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>매매일지</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1b1f24;--mut:#6b7280;--line:#e5e7eb;--chip:#f0f1f3;--buy:#d9363e;--sell:#2563eb;--ma:#f59e0b;--acc:#7c3aed}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--card:#1a1e24;--fg:#e8eaed;--mut:#9aa1ab;--line:#2a2f37;--chip:#262b33;--buy:#ff6b6b;--sell:#6ea8ff;--acc:#a78bfa}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:680px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:18px;margin:0 0 2px;font-weight:700}
.sub{color:var(--mut);font-size:12px;margin-bottom:18px}
.sub a{color:var(--acc);text-decoration:none}

/* 연도·월 선택 */
.nav{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.yr-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.yr-btn{padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;font:inherit;font-size:12px;font-weight:600;color:var(--mut);cursor:pointer}
.yr-btn.sel{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.mo-row{display:flex;flex-wrap:wrap;gap:6px}
.mo-btn{padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:transparent;font:inherit;font-size:12px;font-weight:600;color:var(--mut);cursor:pointer}
.mo-btn[hidden]{display:none}
.mo-btn.has-b{border-color:var(--buy);color:var(--buy)}
.mo-btn.has-s{border-color:var(--sell);color:var(--sell)}
.mo-btn.sel{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* 차트 (보유 종목 클릭 시) */
#chart-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px 8px;margin-bottom:12px;display:none}
.ch-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-bottom:6px}
.ch-n{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-p{font-size:13px;font-weight:600;white-space:nowrap}
.ch-l{display:flex;gap:12px;font-size:11px;color:var(--mut);padding-top:4px}
.ch-l i{display:inline-block;width:9px;height:3px;border-radius:2px;vertical-align:middle;margin-right:3px}
canvas{display:block;width:100%;height:200px}

/* 보유 종목 */
#hold-panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
#hold-title{font-weight:700;font-size:13px;margin-bottom:10px}
#hold-list{display:flex;flex-direction:column;gap:1px}
.h-row{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:7px 4px;border-radius:8px;cursor:pointer;font-size:13px}
.h-row:hover{background:var(--chip)}
.h-row.sel{background:var(--chip)}
.h-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h-px{font-size:11px;color:var(--mut);text-align:right}
.h-ret{font-weight:600;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.h-ret.p{color:var(--buy)}.h-ret.n{color:var(--sell)}
.h-sc{background:var(--chip);border-radius:20px;padding:2px 8px;font-size:11px;font-weight:700;color:var(--mut);cursor:pointer;white-space:nowrap}
.h-sc:hover{background:var(--acc);color:#fff}

/* 점수 설명 모달 */
#sc-modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none;align-items:flex-end;justify-content:center}
#sc-modal.open{display:flex}
#sc-box{background:var(--card);border-radius:16px 16px 0 0;padding:20px 16px 32px;width:100%;max-width:680px;max-height:80vh;overflow-y:auto}
#sc-box h2{margin:0 0 10px;font-size:15px}
.feat-row{display:grid;grid-template-columns:110px 1fr 50px;gap:6px;align-items:center;font-size:12px;margin-bottom:4px}
.feat-name{color:var(--mut);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-wrap{background:var(--chip);border-radius:4px;height:7px;position:relative}
.bar{height:7px;border-radius:4px;position:absolute}
.bar.pos{background:var(--buy);right:50%}.bar.neg{background:var(--sell);left:50%}
.feat-val{text-align:right;font-variant-numeric:tabular-nums}

/* 거래 목록 */
.sec-title{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:16px 0 8px}
#trade-list{display:flex;flex-direction:column;gap:7px}
.tc{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tc-h{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 12px;cursor:pointer;align-items:center}
.tc-name{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc-ret{font-weight:700;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tc-ret.p{color:var(--buy)}.tc-ret.n{color:var(--sell)}
.tc-meta{font-size:11px;color:var(--mut);margin-top:1px}
.tc-b{padding:0 12px 12px;border-top:1px solid var(--line);display:none}
.tc-b.open{display:block}
.dr{display:flex;justify-content:space-between;padding:4px 0;font-size:12px;border-bottom:1px solid var(--line)}
.dr:last-child{border-bottom:0}
.dl{color:var(--mut)}
.rtag{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11px;font-weight:700}
.rtag.tp{background:#fef3c7;color:#92400e}
.rtag.rt{background:#e0f2fe;color:#075985}
.rtag.ma{background:var(--chip);color:var(--mut)}

/* 매도 완료 거래 목록 */
#sold-ctl{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.sd-btn{padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;font:inherit;font-size:12px;font-weight:600;color:var(--mut);cursor:pointer}
.sd-btn.sel{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sd-sum{font-size:12px;color:var(--mut);margin:0 0 8px}
.sd-sum b{color:var(--fg)}
#sold-list{display:flex;flex-direction:column;gap:1px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 12px}
.sd-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--line)}
.sd-row:last-child{border-bottom:0}
.sd-n{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sd-r{font-weight:800;font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
.sd-row{cursor:pointer}
.sd-c{display:none;grid-column:1/3;padding-top:6px}
.sd-c.open{display:block}
.sd-s{font-size:11.5px;color:var(--mut);grid-column:1/3;font-variant-numeric:tabular-nums}
#sold-more{display:block;width:100%;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);font:inherit;font-size:13px;font-weight:700;color:var(--fg);cursor:pointer}
/* 시작 시점 */
#start-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.st-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.st-t{font-weight:700;font-size:14px}.st-v{font-weight:800;font-size:15px;color:var(--acc)}
.st-note{font-size:11px;color:var(--mut);margin-top:8px;line-height:1.5}
/* 월별 수익률 그래프 */
#yr-card,#ret-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px;margin-bottom:14px}
.rc-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:2px}
.rc-t{font-weight:700;font-size:14px}
.rc-y{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.rc-s{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--mut);margin-top:6px}
.rc-s b{color:var(--fg)}
#rc,#yc{height:190px;cursor:pointer;touch-action:manipulation}
/* 월 요약 */
#sum-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.sum-t{font-weight:700;font-size:13px;margin-bottom:8px}
.sum-g{display:grid;grid-template-columns:1fr;gap:6px}
.sum-i{display:flex;justify-content:space-between;font-size:12px;gap:8px}
.sum-i .k{color:var(--mut)}
.sum-i b{font-variant-numeric:tabular-nums}
.sum-big{font-size:15px;padding-bottom:6px;margin-bottom:2px;border-bottom:1px solid var(--line)}
.sum-note{font-size:11px;color:var(--mut);margin-top:8px}
.p{color:var(--buy)}.n{color:var(--sell)}

/* 장부(거래 내역) */
#led{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.lr{border-radius:10px;border:1px solid var(--line);overflow:hidden;background:var(--card)}
.lr.buy{border-left:4px solid var(--sell);background:rgba(37,99,235,.06)}
.lr.sell{border-left:4px solid var(--buy);background:rgba(217,54,62,.06)}
.lr.tax{border-left:4px solid #16a34a;background:rgba(22,163,74,.07)}
.lr.dep{border-left:4px solid var(--mut)}
.mo-btn.plan{border-style:dashed;border-color:var(--acc);color:var(--acc)}
.plan-tag{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:10px;background:var(--acc);color:#fff;font-size:11px;font-weight:700;vertical-align:middle}
.lr.skip{border-left:4px dashed var(--mut);background:transparent}
.lr.skip .lr-k{background:var(--chip);color:var(--mut)}
.lr.skip .lr-n{color:var(--mut)}
.lr-h{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:9px 11px;cursor:default}
.lr.clk .lr-h{cursor:pointer}
.lr-k{font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;white-space:nowrap}
.lr.buy .lr-k{background:var(--sell);color:#fff}
.lr.sell .lr-k{background:var(--buy);color:#fff}
.lr.tax .lr-k{background:#16a34a;color:#fff}
.lr.dep .lr-k{background:var(--mut);color:var(--bg)}
.lr-n{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr-s{font-size:11.5px;color:var(--mut);margin-top:2px;line-height:1.55;font-variant-numeric:tabular-nums}
.lr-s b{color:var(--fg)}
.lr-d{padding:0 11px 10px 11px}
.lr.clk .lr-d{cursor:pointer}
.lr-a{text-align:right;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.lr-b{font-size:11px;color:var(--mut);font-weight:400}
.lr-c{display:none;padding:0 11px 11px}
.lr-c.open{display:block}
.lr.end{background:var(--chip);border-style:dashed}
.lr.end .lr-h{grid-template-columns:1fr auto}
.empty{color:var(--mut);padding:14px;text-align:center;font-size:13px}

/* 점수 나무 */
.meta{color:var(--mut);font-weight:400}
.lr-sc{display:inline-block;margin-left:2px;padding:0 7px;border-radius:10px;background:var(--chip);color:var(--fg);font-weight:700;cursor:pointer}
.lr-sc:hover{background:var(--acc);color:#fff}
.sc-sub{font-size:12px;color:var(--mut);margin-bottom:12px;line-height:1.5}
.tr-root{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--chip);font-weight:700;font-size:14px}
.tr-root .big{font-size:22px}
.tr-kids{margin:0 0 0 14px;padding-left:12px;border-left:2px solid var(--line)}
.tr-node{position:relative;margin-top:8px}
.tr-node::before{content:"";position:absolute;left:-12px;top:18px;width:10px;border-top:2px solid var(--line)}
.tr-g>summary{list-style:none;display:grid;grid-template-columns:1fr 64px 62px;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:9px;cursor:pointer;font-size:13px;font-weight:700}
.tr-g>summary::-webkit-details-marker{display:none}
.tr-g>summary .nm2{display:flex;align-items:center;min-width:0}
.tr-g>summary .nm2::before{content:"▸";margin-right:6px;color:var(--mut);flex:none}
.tr-g[open]>summary .nm2::before{content:"▾"}
.tr-base{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 10px;border:1px dashed var(--line);border-radius:9px;font-size:13px}
.tr-f{display:grid;grid-template-columns:1fr 64px 62px;gap:8px;align-items:center;padding:5px 4px;font-size:12px}
.tr-f .fd{color:var(--mut);font-size:11px}
.tr-f .fn{font-weight:600}
.tr-bar{height:8px;background:var(--chip);border-radius:4px;position:relative}
.tr-bar i{position:absolute;top:0;height:8px;border-radius:4px}
.tr-bar i.pos{background:var(--buy);left:50%}
.tr-bar i.neg{background:var(--sell);right:50%}
.tr-v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.sc-note{font-size:11px;color:var(--mut);margin-top:14px;line-height:1.6}
</style>
</head>
<body>
<main>
  <h1>매매일지</h1>
  <div class="sub">A4 tp2x트레일+금리유예2달 · 월 100만원 · 비용·세금 반영 · <a href="index.html">← 사이트</a></div>

  <div id="start-card"></div>

  <div id="yr-card"></div>

  <div id="ret-card"></div>

  <div class="nav">
    <div class="yr-row" id="yr-row"></div>
    <div class="mo-row" id="mo-row"></div>
  </div>

  <div id="sum-card"></div>

  <div class="sec-title" id="led-label">거래 내역</div>
  <div id="led"></div>

  <div class="sec-title">보유 종목</div>
  <div id="chart-box">
    <div class="ch-h"><div class="ch-n" id="ch-name">&nbsp;</div><div class="ch-p" id="ch-price"></div></div>
    <canvas id="cv"></canvas>
    <div class="ch-l"><span><i style="background:var(--ma)"></i>월 10이평</span><span><i style="background:var(--fg)"></i>월 종가</span><span style="color:var(--buy)">▲ 매수</span><span style="color:var(--sell)">▼ 매도</span></div>
  </div>
  <div id="hold-panel">
    <div id="hold-title">연도·월을 선택하면 그달 말 보유 종목이 표시됩니다.</div>
    <div id="hold-list"></div>
  </div>

  <div class="sec-title" id="sold-label">매도한 거래 전체</div>
  <div id="sold-ctl"></div>
  <div class="sd-sum" id="sold-sum"></div>
  <div id="sold-list"></div>
  <button id="sold-more" hidden>더 보기</button>
</main>

<!-- 점수 설명 모달 -->
<div id="sc-modal">
  <div id="sc-box">
    <div id="sc-content"></div>
  </div>
</div>

<script>
var DATA = null, W = null, LED = null;
var SEL_YM = null, SEL_HOLD = null;
var MONTHS = ['01','02','03','04','05','06','07','08','09','10','11','12'];

var FEAT_DESC = {
  gap:'이평 대비 현재 위치',slope1:'이평 기울기(1개월)',slope3:'이평 기울기(3개월)',slope6:'이평 기울기(6개월)',
  cross24:'24개월 이평 교차 횟수',below:'이평 아래 연속 개월',above24:'24개월 중 이평 위 비율',
  c_ma12:'12이평 대비 종가',ma10_ma24:'10이평/24이평 비율',
  vol:'거래량 변화',vol3:'단기 거래량',
  body:'캔들 몸통 크기',upwick:'윗꼬리 비율',lowwick:'아랫꼬리 비율',range:'고저 변동 범위',
  ret1:'1개월 수익률',ret3:'3개월 수익률',ret12:'12개월 수익률',
  high24:'24개월 고점 대비',dd36:'36개월 최고점 낙폭',volat12:'12개월 변동성',
  idx_above:'지수가 10이평 위',idx_slope:'지수 기울기',idx_ret12:'지수 12개월 수익',
  us:'미국 종목',etf:'ETF 여부',turn:'거래대금 크기(로그)',up6:'6개월 중 상승 개월 수',
  c_ma60:'60이평 대비 종가',hi12_break:'12개월 신고가 돌파',vol_max36:'36개월 최대 거래량 대비',
  prev_fail:'최근 돌파 실패 횟수',ma_up6:'6개월 중 이평 상승 개월',close_pos:'고저 중 종가 위치',gap_prev:'전달 이평 대비'
};
var REASON = { ma10:'10이평 아래', tpTrail:'익절(2배 도달 후 하락)', 'ma10-금리인상':'10이평 아래+금리인상', 'ma10-유예만료':'10이평 아래+유예만료' };

function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function fmt(ym){ var s=String(ym); return s.slice(0,4)+'-'+s.slice(4); }
function pc(v){ return (v>=0?'+':'')+(v*100).toFixed(1)+'%'; }
function px(v){ return v!=null ? (+v).toLocaleString() : '-'; }
function holdMonths(buyYm, sellYm){
  var by=+buyYm, sy=+sellYm;
  return Math.floor(sy/100)*12+sy%100 - (Math.floor(by/100)*12+by%100);
}

/* ── 연도·월 네비게이션 ── */
function renderNav(){
  var yms = Object.keys(DATA.snapshots).sort();
  var years = [...new Set(yms.map(function(ym){ return ym.slice(0,4); }))].sort();
  var selY = SEL_YM ? String(SEL_YM).slice(0,4) : years[years.length-1];

  document.getElementById('yr-row').innerHTML = years.map(function(y){
    return '<button class="yr-btn'+(y===selY?' sel':'')+'" data-y="'+y+'">'+y+'</button>';
  }).join('');
  document.querySelectorAll('#yr-row .yr-btn').forEach(function(b){
    b.onclick=function(){
      var y=b.dataset.y;
      // 해당 연도 첫 달 선택
      var first=yms.find(function(ym){ return ym.slice(0,4)===y; });
      SEL_YM=first; SEL_HOLD=null; renderAll();
    };
  });

  // 선택 연도의 달 버튼
  var moEl = document.getElementById('mo-row');
  var lastYm0=Object.keys(LED?LED.months:DATA.snapshots).sort().pop(), planYm=nextYmOf(lastYm0);
  moEl.innerHTML = MONTHS.map(function(m){
    var ym = selY+m;
    if(ym===planYm) return '<button class="mo-btn plan'+(ym===String(SEL_YM)?' sel':'')+'" data-ym="'+ym+'">'+m+'월 예정</button>';
    var inData = yms.includes(ym);
    var trades = DATA.trades.filter(function(t){ return String(t.buyYm)===ym||String(t.sellYm)===ym; });
    var hasBuy = trades.some(function(t){ return String(t.buyYm)===ym; });
    var hasSell = trades.some(function(t){ return String(t.sellYm)===ym; });
    var cls = 'mo-btn'+(ym===String(SEL_YM)?' sel':hasBuy?' has-b':hasSell?' has-s':'');
    return '<button class="'+cls+'" data-ym="'+ym+'"'+(inData?'':' hidden')+'>'+m+'월</button>';
  }).join('');
  document.querySelectorAll('#mo-row .mo-btn:not([hidden])').forEach(function(b){
    b.onclick=function(){ SEL_YM=b.dataset.ym; SEL_HOLD=null; renderAll(); };
  });
}

/* ── 보유 종목 ── */
function renderHoldings(){
  var ym = SEL_YM;
  var title = document.getElementById('hold-title');
  var list = document.getElementById('hold-list');
  if(!ym){ title.textContent='연도·월을 선택하면 그달 말 보유 종목이 표시됩니다.'; list.innerHTML=''; return; }
  var holds = DATA.snapshots[ym] || [];
  title.textContent = fmt(ym)+' 말 보유 종목 '+holds.length+'개';
  if(!holds.length){ list.innerHTML='<div style="color:var(--mut);padding:4px 0">현금 보유</div>'; return; }
  list.innerHTML = holds.map(function(h,i){
    var ret=h.ret, cls=ret>=0?'p':'n';

    return;

  });
  // 끝 = 기준 월(없으면 가장 가까운 이전 달), 시작 = 36개월 전 또는 매수 3개월 전(최대 84개월)
  var e=yms.length-1; while(e>0 && yms[e]>+endYm) e--;

  var where={}; yms.forEach(function(q,i){ where[q]=i; });

  var F=useLog?Math.log:function(v){ return v; }, G=useLog?Math.exp:function(v){ return v; };

  var L=6, R=52, T=10, B=20, pw=W2-L-R, ph=H-T-B;
  var X=function(i){ return L+(i-s0)/(n-1)*pw; };
  var Y=function(v){ return T+(1-(F(v)-flo)/(fhi-flo))*ph; };

  for(var k=0;k<=3;k++){

    var fw=W.feats.find(function(f){ return f.f===fv[0]; });

function featsFromChart(d, r) {

  var hl = (last.high - last.low) || 1, up = 0, mu = 0;
  for (var k = i - 5; k <= i; k++) { if (c[k] > c[k - 1]) up++; if (ma[k] > ma[k - 1]) mu++; }
  var pf = 0;
  for (var k = Math.max(11, i - 36); k < i - 1; k++)
    if (c[k - 1] <= ma[k - 1] && c[k] > ma[k]) { for (var j = k + 1; j <= Math.min(k + 3, i - 1); j++) if (!above[j]) { pf++; break; } }
  return {
    gap: c[i] / ma[i] - 1, slope1: ma[i] / ma[i - 1] - 1, slope3: ma[i] / ma[i - 3] - 1,
    cross24: cross, below: below, above24: ab / 24, c_ma12: c[i] / ma12 - 1, ma10_ma24: ma[i] / ma24 - 1,
    vol: Math.log((last.vol + 1) / (vAvg + 1)), vol3: Math.log((v3 + 1) / (v12 + 1)),
    body: (c[i] - last.open) / last.open, upwick: (last.high - Math.max(last.open, c[i])) / hl,
    lowwick: (Math.min(last.open, c[i]) - last.low) / hl, range: hl / last.open,
    ret1: c[i] / c[i - 1] - 1, ret3: c[i] / c[i - 3] - 1, ret12: c[i] / c[i - 12] - 1,
    high24: c[i] / hi24 - 1, dd36: c[i] / hi36 - 1, volat12: volat,
    idx_above: 0, idx_slope: 0, idx_ret12: 0,
    us: r['시장'] === 'US' ? 1 : 0, etf: r['종류'] === 'stock' ? 0 : 1,
    turn: Math.log10(avgQ_(v.slice(i - 12, i)) * c[i] + 1), up6: up, slope6: ma[i] / ma[i - 6] - 1,
    c_ma60: c[i] / ma60 - 1, hi12_break: c[i] >= Math.max.apply(null, mon.slice(i - 12, i).map(function (x) { return x.high; })) ? 1 : 0,
    vol_max36: last.vol / (Math.max.apply(null, v.slice(Math.max(0, i - 36), i)) || 1),
    prev_fail: pf, ma_up6: mu, close_pos: (c[i] - last.low) / hl, gap_prev: c[i - 1] / ma[i - 1] - 1
  };
}

function showScoreTree(y,buyYm,name,oldPred,live){
  var modal=document.getElementById('sc-modal'), box=document.getElementById('sc-content');
  var t=live?null:findFeats({y:y,buyYm:buyYm}), e=live?explainFeats(live.feats):(t?explainFeats(t.feats):null);
  if(!e){ box.innerHTML='<h2 style="margin:0 0 6px;font-size:15px">'+esc(name)+'</h2><div class="sc-sub">'+(W?'이 매수의 지표 데이터가 없습니다.':'점수 모델을 아직 불러오지 못했어요. 잠시 뒤 다시 눌러 주세요.')+'</div>'; modal.classList.add('open'); return; }
  var byF={}; e.items.forEach(function(x){ byF[x.f]=x; });
  var pts=shapleyPoints(e.items.map(function(x){ return x.contrib; }), e.b);
  e.items.forEach(function(x,i){ x.pts=pts[i]; });
  var gs=GROUPS.map(function(g){
    var its=g[1].map(function(k){ return byF[k]; }).filter(Boolean).sort(function(a,b){ return Math.abs(b.pts)-Math.abs(a.pts); });
    return {n:g[0],items:its,sum:its.reduce(function(t,x){ return t+x.pts; },0)};
  }).sort(function(a,b){ return Math.abs(b.sum)-Math.abs(a.sum); });
  var maxG=Math.max.apply(null,gs.map(function(g){ return Math.abs(g.sum); }))||1;
  var maxF=Math.max.apply(null,e.items.map(function(x){ return Math.abs(x.pts); }))||1;
  var bar=function(x,m){ var w=Math.min(50,Math.abs(x)/m*50); return '<div class="tr-bar"><i class="'+(x>=0?'pos':'neg')+'" style="width:'+w+'%"></i></div>'; };
  var total=e.score-Math.round(e.base);
  var h='<h2 style="margin:0 0 4px;font-size:16px">'+esc(name)+' · '+fmt(buyYm)+(live?' 구매 예정, ':' 매수, ')+e.score+'점은 왜?</h2>'
    +'<div class="sc-sub" style="color:var(--fg);background:var(--chip);border-radius:8px;padding:8px 10px"><b>참고만 하세요.</b> 이 일지의 판매 완료 거래 664건에서 점수와 수익의 순위상관은 약 0(당시 모델 예측 −0.02)이었습니다.</div><div class="sc-sub">평범한 신호의 점수(기준)에서 시작해, 항목마다 점수를 올리고 내려서 최종 점수가 됩니다. 아래 숫자가 <b>그 항목이 점수를 몇 점 올리거나 내렸는지</b>예요. 항목을 눌러 펼쳐 보세요.</div>'
    +'<div class="tr-root"><span class="big">'+e.score+'점</span><span>= 기준 '+Math.round(e.base)+'점 '+(total>=0?'+ ':'− ')+Math.abs(total)+'점<br><span class="meta">학습 때 신호 중 상위 '+Math.max(1,100-e.score)+'%</span></span></div>'
    +'<div class="tr-kids"><div class="tr-node"><div class="tr-base"><span><b>기준</b> <span class="meta">(평균적인 매수 신호, 예측 수익 '+sgn(e.b)+'%)</span></span><b>'+Math.round(e.base)+'점</b></div></div>';
  gs.forEach(function(g,gi){
    h+='<div class="tr-node"><details class="tr-g"'+(gi<2?' open':'')+'><summary><span class="nm2">'+g.n+'</span>'+bar(g.sum,maxG)+'<span class="tr-v '+(g.sum>=0?'p':'n')+'">'+sp(g.sum)+'</span></summary><div class="tr-kids">';
    g.items.forEach(function(x){
      h+='<div class="tr-node"><div class="tr-f"><div><div class="fn">'+FNAME[x.f]+' <span class="meta">'+fmtV(x.f,x.v)+'</span></div><div class="fd">'+FDESC[x.f]+'</div></div>'+bar(x.pts,maxF)+'<span class="tr-v '+(x.pts>=0?'p':'n')+'">'+sp(x.pts)+'</span></div></div>';
    });

    +(oldPred!=null?'<br>매수한 해에 종목을 실제로 고른 모델의 예측 수익은 '+(oldPred>=0?'+':'')+(oldPred*100).toFixed(1)+'%였습니다.':'')+'</div>';

  box.innerHTML=h; modal.classList.add('open');
}

/* ── 월별 수익률 그래프 (선택한 연도 12개월, 막대를 누르면 그 달로 이동) ── */
var RET = {};
function calcRets(){
  RET = {}; if(!LED) return;
  var ks=Object.keys(LED.months).sort(), dep=LED.meta.dep;
  for(var i=1;i<ks.length;i++){
    var a=LED.months[ks[i]], b=LED.months[ks[i-1]];
    RET[ks[i]] = (a.cash+a.holdVal-dep)/(b.cash+b.holdVal)-1;
  }
}
function renderRetChart(){
  var card=document.getElementById('ret-card');
  if(!LED || !SEL_YM){ card.style.display='none'; return; }
  card.style.display='block';
  var Y=String(SEL_YM).slice(0,4), vals=[], ann=1, n=0, win=0, best=null, worst=null;
  for(var m=1;m<=12;m++){
    var ym=Y+(m<10?'0':'')+m, r=RET[ym];
    vals.push(r==null?null:r);
    if(r!=null){ n++; ann*=1+r; if(r>0) win++; if(best==null||r>best.r) best={r:r,m:m}; if(worst==null||r<worst.r) worst={r:r,m:m}; }
  }
  var annR=ann-1, cls=annR>=0?'p':'n';
  card.innerHTML='<div class="rc-h"><div class="rc-t">'+Y+'년 월별 수익률</div>'
    +(n?'<div class="rc-y '+cls+'">'+pc(annR)+'</div>':'')+'</div>'
    +'<canvas id="rc"></canvas>'
    +(n?'<div class="rc-s"><span>플러스 <b>'+win+'</b> / '+n+'개월</span><span>최고 <b class="p">'+best.m+'월 '+pc(best.r)+'</b></span><span>최저 <b class="'+(worst.r>=0?'p':'n')+'">'+worst.m+'월 '+pc(worst.r)+'</b></span></div>'
      :'<div class="rc-s">이 해는 수익률 데이터가 없습니다.</div>');
  var cv=document.getElementById('rc'); if(!n) { cv.style.display='none'; return; }
  var W2=cv.clientWidth||600, H=190, dpr=window.devicePixelRatio||1;
  cv.width=W2*dpr; cv.height=H*dpr; cv.style.height=H+'px';
  var g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W2,H);
  var buyC=cssv('--buy'), sellC=cssv('--sell'), mut=cssv('--mut'), line=cssv('--line'), fg=cssv('--fg');
  var hi=0, lo=0; vals.forEach(function(v){ if(v!=null){ hi=Math.max(hi,v); lo=Math.min(lo,v); } });
  var span=(hi-lo)||0.01; hi+=span*0.14; lo-=span*(lo<0?0.14:0);
  var T=6, B=22, ph=H-T-B, slot=W2/12, bw=Math.min(30,slot*0.64);
  var Y0=function(v){ return T+(hi-v)/(hi-lo)*ph; };
  g.textAlign='center'; g.textBaseline='middle';
  // 0% 선
  g.strokeStyle=mut; g.lineWidth=1; g.beginPath(); g.moveTo(0,Y0(0)); g.lineTo(W2,Y0(0)); g.stroke();
  vals.forEach(function(v,i){
    var cx=i*slot+slot/2, ym=Y+(i<9?'0':'')+(i+1), sel=String(SEL_YM)===ym;
    g.font=(sel?'700 ':'')+'11px -apple-system,sans-serif';
    g.fillStyle=sel?fg:mut; g.fillText((i+1)+'월',cx,H-9);
    if(v==null) return;
    var yTop=Y0(Math.max(v,0)), yBot=Y0(Math.min(v,0)), h=Math.max(2,yBot-yTop);
    g.globalAlpha=(SEL_YM && !sel)?0.55:1;
    g.fillStyle=v>=0?buyC:sellC; g.fillRect(cx-bw/2,v>=0?yTop-(h-(yBot-yTop)):yTop,bw,h);

/* ── 이번 달(아직 구매 전) 예정 주문: 지금 사면 어떻게 사는지 ── */
var API='https://script.google.com/macros/s/AKfycbwneUZ409vUCsLONb7sBwv7zeVeo0CGtxXfMsou-bAm6OOW4q4l1RGzQ89ZKVHQ2jyS/exec';   // 시트(Apps Script) 웹 앱: 이번 달 점수·가격 (index.html과 같은 주소)
var COSTS=null, PLAN=null, PLAN_YM=null, PLAN_BUSY=false, PLAN_ERR=null, BARS_C={};
function isUSy(y){ return !/\.(KS|KQ)$/.test(y); }
function nextYmOf(ym){ ym=+ym; return String(ym%100===12 ? ym+89 : ym+1); }
function barsOf(y){
  if(BARS_C[y]) return BARS_C[y];
  var raw=BARS&&BARS[y]; if(!raw) return null;
  var b={yms:[],cs:[],pos:{}};
  for(var i=0;i<raw.length;i+=2){ b.pos[raw[i]]=b.yms.length; b.yms.push(raw[i]); b.cs.push(raw[i+1]); }
  BARS_C[y]=b; return b;
}
function ma10At(cs,i){ if(i<9) return null; var t=0; for(var k=i-9;k<=i;k++) t+=cs[k]; return t/10; }
function krTaxY(Y){ var t=COSTS.kr.sell_tax, v=0; Object.keys(t).map(Number).sort().forEach(function(y){ if(y<=Y) v=t[y]; }); return v; }
function isEtfHold(h){ var t=findFeats({y:h.y,buyYm:h.buyYm}); var f=t&&t.feats.filter(function(x){ return x[0]==='etf'; })[0]; return !!(f&&f[1]===1); }

// 시뮬레이션(7_backtest.js)과 같은 규칙: 매도(익절 트레일 → 10이평 아래 유예 2달, 금리 인상 중이면 즉시) → 입금 → 정수 주 매수(종목당 현금÷4)
// o: {nowYm, lastYm, holds[], cash, dep, fx, rateUp, picks[{y,name,us,px,score}], N}
function planCore(o){
  var C=COSTS, usFee=C.us.commission+C.us.fx_spread, krFee=C.kr.commission, year=Math.floor(+o.nowYm/100);
  var sells=[], watch=[], cash=o.cash;
  o.holds.forEach(function(h){
    var b=barsOf(h.y); if(!b) return;
    var iNow=b.pos[o.nowYm], iBuy=b.pos[h.buyYm]; if(iNow==null||iBuy==null) return;       // 이번 달 가격이 없으면 보유 유지
    var iEnd=b.pos[o.lastYm]!=null?b.pos[o.lastYm]:iNow-1, tp=false, gc=0;
    for(var m=iBuy+1;m<=iEnd;m++){                                                         // 매수 다음 달~지난달 상태 복원
      var mm=ma10At(b.cs,m); if(mm==null) continue;
      if(b.cs[m]>=2*mm) tp=true;
      if(b.cs[m]<mm) gc++; else gc=0;
    }
    var price=b.cs[iNow], ma=ma10At(b.cs,iNow), reason=null, status=null;
    if(ma!=null){
      if(price>=2*ma) tp=true; else if(tp) reason='tpTrail';
      if(!reason && price<ma){
        var need=o.rateUp?1:2;
        if(gc+1>=need) reason=o.rateUp?'ma10-금리인상':'ma10-유예만료'; else status='유예';
      }
    }
    var us=isUSy(h.y);
    if(reason){
      var fxv=us?o.fx:1, val=h.sh*price*fxv, feeR=us?usFee:krFee, taxR=us?0:(isEtfHold(h)?0:krTaxY(year)), got=val*(1-feeR-taxR);
      sells.push({y:h.y,name:h.name||h.y,us:us,sh:h.sh,px:price,fxUsed:us?o.fx:null,gross:val,fee:val*feeR,feeRate:feeR,tax:val*taxR,taxRate:taxR,amt:got,basis:h.basis,ret:got/h.basis-1,reason:reason,buyYm:h.buyYm,buyPx:h.buyPx});
      cash+=got;
    } else if(status) watch.push({y:h.y,name:h.name||h.y,us:us,buyYm:h.buyYm});
  });
  var taxPaid=0;
  if(+o.nowYm%100===12){                                                                    // 12월: 그해 미국 주식 실현 이익에서 250만원 공제 후 22%를 입금 전에 냄
    var gain=o.usGainYtd||0; sells.forEach(function(x){ if(x.us) gain+=x.amt-x.basis; });
    taxPaid=C.us.cg_tax_rate*Math.max(0,gain-C.us.cg_exemption_krw); taxPaid=Math.min(taxPaid,cash); cash-=taxPaid;
  }
  var cash1=cash+o.dep, N=o.N||4, per=cash1/N, buys=[], skipped=[], c=cash1;
  o.picks.forEach(function(r){
    var fee=r.us?usFee:krFee, pKrw=r.px*(r.us?o.fx:1), lots=Math.floor(Math.min(per,c)*(1-fee)/pKrw);
    if(lots<1){ skipped.push({y:r.y,name:r.name,us:r.us,px:r.px,one:pKrw,per:Math.min(per,c)}); return; }
    var a=lots*pKrw/(1-fee); c-=a;
    buys.push({y:r.y,name:r.name,us:r.us,sh:lots,px:r.px,fxUsed:r.us?o.fx:null,gross:a*(1-fee),fee:a*fee,feeRate:fee,amt:a,score:r.score,row:r.row});
  });
  return {sells:sells,watch:watch,buys:buys,skipped:skipped,tax:taxPaid,cash0:o.cash,cashAfterSell:cash,cash1:cash1,cashEnd:c};
}

function usGainYtdOf(nowYm){            // 그해 1월~지난달 미국 주식 실현 이익(판매금 - 구매금액)
  var Y=String(nowYm).slice(0,4), g=0;
  Object.keys(LED.months).forEach(function(ym){ if(ym.slice(0,4)===Y && ym<String(nowYm)) LED.months[ym].sells.forEach(function(x){ if(x.us) g+=x.amt-x.basis; }); });
  return g;
}

function loadPlan(){

  var ps=[
    new Promise(function(res){ loadBars(res); }),
    fetch('tools/learn/costs.json').then(function(r){ return r.json(); }).then(function(c){ COSTS=c; }),
    fetch(API).then(function(r){ return r.json(); })
  ];
  Promise.all(ps).then(function(r){
    var api=r[2], lastYm=Object.keys(LED.months).sort().pop(), L=LED.months[lastYm];
    var picks=api.rows.filter(function(x){ return x['신호']==='매수' && x['점수']!=null && x['점수']!==''; })
      .sort(function(a,b){ return (+b['점수'])-(+a['점수']) || (+b['시총'])-(+a['시총']); })
      .slice(0,4).map(function(x){ return {y:x['시장']==='US'?x['코드']:x['코드']+(x['시장']==='KOSPI'?'.KS':'.KQ'),name:x['이름'],us:x['시장']==='US',px:+x['최근종가'],score:+x['점수'],cap:x['시총'],row:x}; });
    var core=planCore({nowYm:nextYmOf(lastYm),lastYm:lastYm,holds:DATA.snapshots[lastYm]||[],cash:L.cash,dep:LED.meta.dep,fx:L.fx,rateUp:api.rateUp===true,picks:picks,N:4,usGainYtd:usGainYtdOf(nextYmOf(lastYm))});
    core.api={updated:api.updated,rateUp:api.rateUp,candidates:api.rows.filter(function(x){ return x['신호']==='매수'; }).length};
    PLAN=core; PLAN_YM=nextYmOf(lastYm); PLAN_BUSY=false; renderAll();
  }).catch(function(e){ PLAN_BUSY=false; PLAN_ERR=String(e&&e.message||e); renderAll(); });
}

        var f=ch&&ch.length?featsFromChart(ch,r):null;
        if(!f){ showScoreTree(b.y,+SEL_YM,b.name,null,{feats:[],apiScore:b.score}); return; }
        showScoreTree(b.y,+SEL_YM,b.name,null,{feats:Object.keys(f).map(function(k){ return [k,f[k]]; }),apiScore:b.score});
      } else showScoreTree(c.dataset.sy,+c.dataset.sb,c.dataset.sn,c.dataset.sp===''?null:+c.dataset.sp);
    };
  });
}


/* ── 시작 시점 바꾸기: 그 달부터 같은 규칙으로 월 100만원씩 투자했다면 (브라우저에서 다시 계산) ──
   매달 무엇을 사는지(점수 상위 4)와 언제 파는지는 현금과 무관하게 정해지므로, 현금·수량·세금만 다시 계산한다. */
var LED0=null, SNAP0=null, START_YM=null, START_Y=null, FIRST_YM=null, EXIT_C=null;
function loadCosts(cb){ if(COSTS){ cb(); return; } fetch('tools/learn/costs.json').then(function(r){ return r.json(); }).then(function(c){ COSTS=c; cb(); }); }
function exitMap(){
  if(EXIT_C) return EXIT_C; EXIT_C={};
  DATA.trades.forEach(function(t){ EXIT_C[t.y+'|'+t.buyYm]={ym:String(t.sellYm),reason:t.reason}; });
  return EXIT_C;
}
function simulateFrom(S){
  var C=COSTS, usFee=C.us.commission+C.us.fx_spread, krFee=C.kr.commission, dep=LED0.meta.dep, EX=exitMap();
  var yms=Object.keys(LED0.months).sort().filter(function(ym){ return ym>=S; });
  var holds=[], cash=0, months={}, snaps={}, usGain={}, lastPx={};
  var closeAt=function(y,ym,fallback){ var b=barsOf(y); var i=b&&b.pos[ym]; return i!=null?b.cs[i]:fallback; };
  yms.forEach(function(ym){
    var M0=LED0.months[ym], fx=M0.fx, Y=+ym.slice(0,4), mo=+ym.slice(4), sells=[], keep=[];
    holds.forEach(function(h){
      if(h.exit && h.exit<=ym){                                              // 판매
        var px=closeAt(h.y,ym,h.last), val=h.sh*px*(h.us?fx:1), feeR=h.us?usFee:krFee, taxR=h.us?0:(h.etf?0:krTaxY(Y)), got=val*(1-feeR-taxR);
        if(h.us) usGain[Y]=(usGain[Y]||0)+got-h.basis;
        sells.push({y:h.y,name:h.name,us:h.us,sh:h.sh,px:px,fxUsed:h.us?fx:null,gross:val,fee:val*feeR,feeRate:feeR,tax:val*taxR,taxRate:taxR,amt:got,basis:h.basis,ret:got/h.basis-1,reason:h.exitReason,buyYm:h.buyYm});
        cash+=got;
      } else keep.push(h);
    });
    holds=keep;
    var tax=0;
    if(mo===12){ tax=C.us.cg_tax_rate*Math.max(0,(usGain[Y]||0)-C.us.cg_exemption_krw); usGain[Y]=0; cash=Math.max(0,cash-tax); }
    cash+=dep;
    var per=cash/4, buys=[], skipped=[];
    M0.buys.forEach(function(r){                                             // 그달 점수 상위 종목(원래 일지의 선택)을 같은 순서로
      var fee=r.us?usFee:krFee, pKrw=r.px*(r.us?fx:1), lots=Math.floor(Math.min(per,cash)*(1-fee)/pKrw);
      if(lots<1){ skipped.push({y:r.y,name:r.name,us:r.us,px:r.px,one:pKrw,per:Math.min(per,cash)}); return; }
      var a=lots*pKrw/(1-fee); cash-=a;
      var ex=EX[r.y+'|'+ym];
      holds.push({y:r.y,name:r.name,us:r.us,etf:isEtfHold({y:r.y,buyYm:+ym}),sh:lots,buyYm:+ym,buyPx:r.px,basis:a,last:r.px,score:r.score,exit:ex?ex.ym:null,exitReason:ex?ex.reason:null});
      buys.push({y:r.y,name:r.name,us:r.us,sh:lots,px:r.px,fxUsed:r.us?fx:null,gross:a*(1-fee),fee:a*fee,feeRate:fee,amt:a,score:r.score});
    });
    M0.skipped.forEach(function(r){ skipped.push({y:r.y,name:r.name,us:r.us,px:r.px,one:r.one,per:Math.min(per,cash)}); });   // 원래도 못 산 종목(월봉 데이터 없음)
    var hv=0;
    holds.forEach(function(h){ h.last=closeAt(h.y,ym,h.last); hv+=h.sh*h.last*(h.us?fx:1); });
    months[ym]={dep:dep,tax:Math.round(tax),cash:Math.round(cash),holdVal:Math.round(hv),fx:fx,
      buys:buys.map(function(x){ return Object.assign({},x,{amt:Math.round(x.amt),gross:Math.round(x.gross),fee:Math.round(x.fee)}); }),
      sells:sells.map(function(x){ return Object.assign({},x,{amt:Math.round(x.amt),basis:Math.round(x.basis),gross:Math.round(x.gross),fee:Math.round(x.fee),tax:Math.round(x.tax)}); }),
      skipped:skipped.map(function(x){ return Object.assign({},x,{one:Math.round(x.one),per:Math.round(x.per)}); })};
    snaps[ym]=holds.map(function(h){ return {y:h.y,name:h.name,buyYm:h.buyYm,buyPx:h.buyPx,curPx:h.last,sh:h.sh,basis:h.basis,ret:h.last/h.buyPx-1,score:h.score}; });
  });
  return {meta:LED0.meta,months:months,snaps:snaps};
}
function applyStart(S){
  START_YM=S; START_Y=S.slice(0,4); PLAN=null; PLAN_BUSY=false; PLAN_ERR=null;
  var done=function(){
    if(S===FIRST_YM){ LED=LED0; DATA.snapshots=SNAP0; }
    else { var r=simulateFrom(S); LED={meta:r.meta,months:r.months}; DATA.snapshots=r.snaps; }
    calcRets();
    var yms=Object.keys(LED.months).sort();
    if(!SEL_YM || String(SEL_YM)<yms[0] || (PLAN_YM&&String(SEL_YM)===PLAN_YM&&false)) SEL_YM=yms[yms.length-1];
    if(SEL_YM && String(SEL_YM)!==PLAN_YM && yms.indexOf(String(SEL_YM))<0) SEL_YM=yms[0];
    renderAll();
  };
  if(S===FIRST_YM){ done(); return; }
  loadBars(function(){ loadCosts(done); });
}
function renderStartCard(){
  var card=document.getElementById('start-card'); if(!LED0){ card.style.display='none'; return; }
  card.style.display='block';
  var yms=Object.keys(LED0.months).sort(), years=[], seen={}; yms.forEach(function(ym){ var y=ym.slice(0,4); if(!seen[y]){ seen[y]=1; years.push(y); } });
  var selY=START_Y||years[0];
  var h='<div class="st-h"><div class="st-t">시작 시점</div><div class="st-v">'+fmt(START_YM)+'부터</div></div>'
    +'<div class="yr-row">'+years.map(function(y){ return '<button class="yr-btn'+(y===selY?' sel':'')+'" data-sy="'+y+'">'+y+'</button>'; }).join('')+'</div>'
    +'<div class="mo-row">'+MONTHS.map(function(m){ var ym=selY+m, ok=yms.indexOf(ym)>=0;
        return '<button class="mo-btn'+(ym===START_YM?' sel':'')+'" data-sm="'+ym+'"'+(ok?'':' hidden')+'>'+m+'월</button>'; }).join('')+'</div>'
    +'<div class="st-note">'+(START_YM===FIRST_YM?'기본(2011-12)부터 매달 100만원씩 같은 규칙으로 투자한 기록입니다. ':'선택한 달부터 빈손으로 시작해 매달 100만원씩 같은 규칙(매달 점수 상위 4종목, 같은 판매 기준)으로 투자했다면의 계산입니다. ')
    +'시작 시점을 바꾸면 아래 모든 그래프·거래 내역이 그 기준으로 다시 계산돼요.</div>';
  card.innerHTML=h;
  card.querySelectorAll('[data-sy]').forEach(function(b){ b.onclick=function(){ START_Y=b.dataset.sy; renderStartCard(); }; });
  card.querySelectorAll('[data-sm]').forEach(function(b){ b.onclick=function(){ if(b.dataset.sm!==START_YM) applyStart(b.dataset.sm); else renderStartCard(); }; });
}


/* ── 매도한 거래 전체 목록 (시작 시점부터, 구매 연월·판매 연월·수익률·구매 당시 점수) ── */
var SOLD_SORT='buy', SOLD_LIMIT=100;
function renderSoldList(){
  if(!LED||!DATA) return;
  var rows=[];
  Object.keys(LED.months).sort().forEach(function(ym){
    LED.months[ym].sells.forEach(function(x){
      var sv=scoreOf(x.y,x.buyYm); rows.push({y:x.y,name:x.name,us:x.us,buyYm:String(x.buyYm),sellYm:ym,ret:x.ret,reason:x.reason,score:sv,amt:x.amt});
    });
  });
  var cmp={
    buy:function(a,b){ return a.buyYm<b.buyYm?-1:a.buyYm>b.buyYm?1:(a.sellYm<b.sellYm?-1:1); },
    score:function(a,b){ return ((b.score==null?-1:b.score)-(a.score==null?-1:a.score))||(b.ret-a.ret); },
    ret:function(a,b){ return b.ret-a.ret; },
    loss:function(a,b){ return a.ret-b.ret; }
  };
  rows.sort(cmp[SOLD_SORT]);
  var win=rows.filter(function(r){ return r.ret>0; }).length;
  document.getElementById('sold-label').textContent='매도한 거래 전체 · '+fmt(START_YM||Object.keys(LED.months).sort()[0])+'부터';
  document.getElementById('sold-sum').innerHTML='판매 완료 <b>'+rows.length+'건</b> · 수익 난 거래 <b>'+win+'건 ('+(rows.length?Math.round(win/rows.length*100):0)+'%)</b> · 점수는 구매 당시 지표를 최신 모델로 계산한 값(점수 칩을 누르면 이유, 줄을 누르면 판매 당시까지의 월봉 그래프)';
  var btn=function(k,t){ return '<button class="sd-btn'+(SOLD_SORT===k?' sel':'')+'" data-k="'+k+'">'+t+'</button>'; };
  document.getElementById('sold-ctl').innerHTML=btn('buy','구매 순(오래된 것부터)')+btn('score','점수 높은 순')+btn('ret','수익률 높은 순')+btn('loss','수익률 낮은 순');
  document.querySelectorAll('#sold-ctl .sd-btn').forEach(function(b){ b.onclick=function(){ SOLD_SORT=b.dataset.k; SOLD_LIMIT=100; renderSoldList(); }; });
  var shown=rows.slice(0,SOLD_LIMIT);
  document.getElementById('sold-list').innerHTML=shown.map(function(r){
    var hm=holdMonths(r.buyYm,r.sellYm), cls=r.ret>=0?'p':'n';
    return '<div class="sd-row" data-y="'+esc(r.y)+'" data-b="'+r.buyYm+'" data-s="'+r.sellYm+'"><div class="sd-n">'+esc(r.name)+(r.us?' <span class="lr-b">미국</span>':'')+'</div><div class="sd-r '+cls+'">'+pc(r.ret)+'</div>'
      +'<div class="sd-s"><b>구매 '+fmt(r.buyYm)+'</b> → 판매 '+fmt(r.sellYm)+' · '+hm+'개월 · 점수 <span class="lr-sc" data-sy="'+esc(r.y)+'" data-sb="'+r.buyYm+'" data-sn="'+esc(r.name)+'" data-sp="">'+(r.score==null?'-':r.score)+'</span> · '+esc(REASON[r.reason]||r.reason||'')+'</div><div class="sd-c"><canvas></canvas></div></div>';
  }).join('');
  document.querySelectorAll('#sold-list .sd-row').forEach(function(row){          // 줄을 누르면 판매 당시까지의 월봉 그래프
    row.onclick=function(ev){
      if(ev.target.classList.contains('lr-sc')) return;
      var box=row.querySelector('.sd-c'); box.classList.toggle('open');
      if(box.classList.contains('open')) drawChart(box.querySelector('canvas'),row.dataset.y,row.dataset.s,row.dataset.b,row.dataset.s);
    };
  });
  document.querySelectorAll('#sold-list .lr-sc').forEach(function(c){
    c.onclick=function(ev){ ev.stopPropagation(); var t=DATA.trades.filter(function(z){ return z.y===c.dataset.sy&&String(z.buyYm)===c.dataset.sb; })[0]; showScoreTree(c.dataset.sy,+c.dataset.sb,c.dataset.sn,t?t.score:null); };
  });
  var more=document.getElementById('sold-more');
  more.hidden=rows.length<=SOLD_LIMIT; more.textContent='더 보기 ('+Math.min(rows.length-SOLD_LIMIT,300)+'건 더, 남은 '+(rows.length-SOLD_LIMIT)+'건)';
  more.onclick=function(){ SOLD_LIMIT+=300; renderSoldList(); };
}

function renderAll(){
  renderStartCard(); renderSoldList(); renderYearChart(); renderRetChart(); renderNav();
  if(PLAN_YM && String(SEL_YM)===PLAN_YM){
    renderPlanView();
    document.getElementById('hold-title').textContent='예정 주문을 반영한 보유 종목은 위 거래 내역을 기준으로 봐 주세요.'; document.getElementById('hold-list').innerHTML='';
    document.getElementById('chart-box').style.display='none';
    if(!PLAN) loadPlan();
    return;
  }
  renderSummary(); renderLedger(); renderHoldings(); document.getElementById('chart-box').style.display='none';
}

fetch('tools/learn/result/weights.json').then(function(r){ return r.json(); }).then(function(w){ W=w; if(DATA) renderAll(); }).catch(function(){});
fetch('tools/learn/result/ledger.json').then(function(r){ return r.json(); }).then(function(l){ LED=l; LED0=l; FIRST_YM=Object.keys(l.months).sort()[0]; START_YM=FIRST_YM; START_Y=FIRST_YM.slice(0,4); calcRets(); PLAN_YM=nextYmOf(Object.keys(l.months).sort().pop()); }).catch(function(){})
.then(function(){ return fetch('tools/learn/result/trades.json'); }).then(function(r){ return r.json(); }).then(function(d){
  DATA=d; SNAP0=d.snapshots;
  var yms=Object.keys(d.snapshots).sort();
  SEL_YM=yms[yms.length-1]||null;
  renderAll();
}).catch(function(){
  document.querySelector('main').innerHTML='<p style="color:var(--mut);padding:40px;text-align:center">데이터를 불러오지 못했어요.</p>';
});
</script>
