<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>매매일지 — 월봉 10이평 전략</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1b1f24;--mut:#6b7280;--line:#e5e7eb;--chip:#f0f1f3;--buy:#d9363e;--sell:#2563eb;--ma:#f59e0b}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--card:#1a1e24;--fg:#e8eaed;--mut:#9aa1ab;--line:#2a2f37;--chip:#262b33;--buy:#ff6b6b;--sell:#6ea8ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--mut);font-size:12px;margin-bottom:20px}
a{color:var(--mut);font-size:12px}
/* 타임라인 */
.timeline{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px;scrollbar-width:none}
.timeline::-webkit-scrollbar{display:none}
.ym-btn{flex:0 0 auto;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);font:inherit;font-size:12px;font-weight:600;color:var(--mut);cursor:pointer;white-space:nowrap}
.ym-btn.has-buy{border-color:var(--buy);color:var(--buy)}
.ym-btn.has-sell{border-color:var(--sell);color:var(--sell)}
.ym-btn.sel{background:var(--fg);color:var(--bg);border-color:var(--fg)}
/* 보유 패널 */
#holdings-panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px}
#holdings-title{font-weight:700;font-size:13px;margin-bottom:8px}
#holdings-list{display:flex;flex-direction:column;gap:6px}
.h-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.h-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.h-ret.p{color:var(--buy)}.h-ret.n{color:var(--sell)}
.h-score{background:var(--chip);border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700;color:var(--mut)}
/* 거래 목록 */
.section-title{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:16px 0 8px}
#trade-list{display:flex;flex-direction:column;gap:8px}
.trade-card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tc-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;cursor:pointer;gap:8px}
.tc-name{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc-ret{font-weight:700;font-size:14px;white-space:nowrap}
.tc-ret.p{color:var(--buy)}.tc-ret.n{color:var(--sell)}
.tc-meta{font-size:11px;color:var(--mut);margin-top:2px}
.tc-body{padding:0 12px 12px;border-top:1px solid var(--line);display:none}
.tc-body.open{display:block}
.detail-row{display:flex;justify-content:space-between;padding:4px 0;font-size:12px;border-bottom:1px solid var(--line)}
.detail-row:last-child{border-bottom:0}
.detail-label{color:var(--mut)}
/* 피처 바 */
.feat-title{font-size:11px;color:var(--mut);margin:10px 0 6px;font-weight:700}
.feat-list{display:flex;flex-direction:column;gap:4px}
.feat-row{display:grid;grid-template-columns:100px 1fr 48px;gap:6px;align-items:center;font-size:11px}
.feat-name{color:var(--mut);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feat-bar-wrap{background:var(--chip);border-radius:4px;height:8px;position:relative}
.feat-bar{height:8px;border-radius:4px;position:absolute}
.feat-bar.pos{background:var(--buy);right:50%}.feat-bar.neg{background:var(--sell);left:50%}
.feat-val{color:var(--fg);text-align:right}
.reason-tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:11px;font-weight:700;background:var(--chip);color:var(--mut)}
.reason-tag.tpTrail{background:#fef3c7;color:#92400e}
.reason-tag.rate{background:#e0f2fe;color:#075985}
</style>
</head>
<body>
<main>
  <h1>매매일지</h1>
  <div class="sub">전략: A4 tp2x트레일+금리유예2달 · 월 100만원 적립 · 비용·세금 반영 · <a href="index.html">← 사이트로</a></div>
  <div class="timeline" id="timeline"></div>
  <div id="holdings-panel">
    <div id="holdings-title">달을 선택하면 그달 보유 종목이 표시됩니다.</div>
    <div id="holdings-list"></div>
  </div>
  <div class="section-title" id="trade-label">거래 내역</div>
  <div id="trade-list"></div>
</main>
<script>
var DATA = null;
var SEL_YM = null;
var FEAT_DESC = {
  gap:'이평 대비 현재 위치',slope1:'이평 기울기(1개월)',slope3:'이평 기울기(3개월)',slope6:'이평 기울기(6개월)',
  cross24:'24개월 이평 교차 횟수',below:'이평 아래 연속 개월',above24:'24개월 중 이평 위 비율',
  c_ma12:'12이평 대비 종가',ma10_ma24:'10이평/24이평 비율',
  vol:'거래량 변화',vol3:'단기 거래량',
  body:'캔들 몸통',upwick:'윗꼬리',lowwick:'아랫꼬리',range:'고저 범위',
  ret1:'1개월 수익',ret3:'3개월 수익',ret12:'12개월 수익',
  high24:'24개월 고점 대비',dd36:'36개월 고점 대비',volat12:'12개월 변동성',
  idx_above:'지수 이평 위',idx_slope:'지수 기울기',idx_ret12:'지수 12개월 수익',
  us:'미국 여부',etf:'ETF 여부',turn:'거래대금 크기',up6:'6개월 중 상승 개월',
  c_ma60:'60이평 대비 종가',hi12_break:'12개월 신고가',vol_max36:'최대 거래량 대비',
  prev_fail:'이전 돌파 실패',ma_up6:'6개월 중 이평 상승',close_pos:'고저 중 종가 위치',gap_prev:'전달 이평 대비'
};
var REASON_LABEL = { ma10:'10이평 아래', tpTrail:'익절(2배 도달 후 하락)', 'ma10-금리인상':'10이평 아래 (금리 인상)', 'ma10-유예만료':'10이평 아래 (유예 만료)' };

function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function fmt(ym){ var s=String(ym); return s.slice(0,4)+'-'+s.slice(4); }
function pc(v){ return (v>=0?'+':'')+(v*100).toFixed(1)+'%'; }

function renderTimeline(){
  var tl = document.getElementById('timeline');
  // 모든 ym 수집 (스냅샷 기준)
  var yms = Object.keys(DATA.snapshots).sort();
  tl.innerHTML = yms.map(function(ym){
    var trades = DATA.trades.filter(function(t){ return String(t.buyYm)===ym||String(t.sellYm)===ym; });
    var hasBuy = trades.some(function(t){ return String(t.buyYm)===ym; });
    var hasSell = trades.some(function(t){ return String(t.sellYm)===ym; });
    var cls = ym===String(SEL_YM)?'ym-btn sel':hasBuy?'ym-btn has-buy':hasSell?'ym-btn has-sell':'ym-btn';
    return '<button class="'+cls+'" data-ym="'+ym+'">'+fmt(ym)+'</button>';
  }).join('');
  tl.querySelectorAll('.ym-btn').forEach(function(b){
    b.onclick=function(){ SEL_YM=b.dataset.ym; renderAll(); b.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'}); };
  });
  // 최신 달로 스크롤
  var last = tl.querySelector('.ym-btn:last-child');
  if(last) setTimeout(function(){ last.scrollIntoView({inline:'end',block:'nearest'}); },100);
}

function renderHoldings(){
  var ym = SEL_YM;
  var panel = document.getElementById('holdings-panel');
  var title = document.getElementById('holdings-title');
  var list = document.getElementById('holdings-list');
  if(!ym){ title.textContent='달을 선택하면 그달 보유 종목이 표시됩니다.'; list.innerHTML=''; return; }
  var holds = DATA.snapshots[ym] || [];
  title.textContent = fmt(ym)+' 말 보유 종목 '+holds.length+'개';
  list.innerHTML = holds.map(function(h){
    var ret = h.ret, cls = ret>=0?'p':'n';
    return '<div class="h-row"><span class="h-name">'+esc(h.name||h.y)+'</span>'+
      '<span style="color:var(--mut);font-size:11px">매수 '+fmt(h.buyYm)+'</span>'+
      '<span class="h-ret '+cls+'">'+pc(ret)+'</span>'+
      '<span class="h-score">'+Math.round(h.score*100)+'점</span></div>';
  }).join('') || '<div style="color:var(--mut);font-size:13px">현금 보유</div>';
}

function renderTrades(){
  var ym = SEL_YM;
  var label = document.getElementById('trade-label');
  var list = document.getElementById('trade-list');
  var trades;
  if(ym){
    trades = DATA.trades.filter(function(t){ return String(t.buyYm)===ym||String(t.sellYm)===ym; });
    label.textContent = fmt(ym)+' 거래 내역 ('+trades.length+'건)';
  } else {
    trades = DATA.trades.slice().sort(function(a,b){ return b.sellYm-a.sellYm; }).slice(0,30);
    label.textContent = '최근 거래 30건';
  }
  if(!trades.length){ list.innerHTML='<div style="color:var(--mut);padding:16px;text-align:center">거래 없음</div>'; return; }
  list.innerHTML = trades.map(function(t,idx){
    var isBuy = ym && String(t.buyYm)===ym, isSell = ym && String(t.sellYm)===ym;
    var ret = t.ret, cls = ret>=0?'p':'n';
    var reasonTag = t.reason ? '<span class="reason-tag'+(t.reason.includes('tp')?' tpTrail':t.reason.includes('금리')?' rate':'')+'" title="매도 사유">'+esc(REASON_LABEL[t.reason]||t.reason)+'</span>' : '';
    // 피처 기여도 상위 5개
    var featHtml = '';
    if(t.feats && t.feats.length && DATA.meta){
      var W = window._weights;
      if(W){
        var contribs = t.feats.map(function(fv){
          var fw = W.feats.find(function(f){ return f.f===fv[0]; });
          if(!fw) return null;
          var cl = Math.min(fw.hi, Math.max(fw.lo, fv[1]));
          var z = (cl-fw.m)/fw.sd;
          return { f: fv[0], z: z, contrib: z*fw.w, raw: fv[1] };
        }).filter(Boolean).sort(function(a,b){ return Math.abs(b.contrib)-Math.abs(a.contrib); }).slice(0,5);
        featHtml = '<div class="feat-title">점수에 영향 준 지표 (상위 5개)</div><div class="feat-list">'+
          contribs.map(function(c){
            var pct = Math.min(50,Math.abs(c.z)*15), pos = c.contrib>0;
            return '<div class="feat-row"><div class="feat-name" title="'+(FEAT_DESC[c.f]||c.f)+'">'+esc(c.f)+'</div>'+
              '<div class="feat-bar-wrap"><div class="feat-bar '+(pos?'pos':'neg')+'" style="width:'+pct+'%"></div></div>'+
              '<div class="feat-val">'+(c.contrib>0?'+':'')+c.contrib.toFixed(3)+'</div></div>';
          }).join('')+'</div>';
      }
    }
    return '<div class="trade-card" data-idx="'+idx+'">'+
      '<div class="tc-head">'+
        '<div><div class="tc-name">'+esc(t.name||t.y)+'</div>'+
        '<div class="tc-meta">매수 '+fmt(t.buyYm)+' → 매도 '+fmt(t.sellYm)+'</div></div>'+
        '<div style="text-align:right"><div class="tc-ret '+cls+'">'+pc(ret)+'</div>'+
        '<div class="tc-meta">'+reasonTag+'</div></div>'+
      '</div>'+
      '<div class="tc-body">'+
        '<div class="detail-row"><span class="detail-label">매수가</span><span>'+t.buyPx.toLocaleString()+'</span></div>'+
        '<div class="detail-row"><span class="detail-label">매도가</span><span>'+t.sellPx.toLocaleString()+'</span></div>'+
        '<div class="detail-row"><span class="detail-label">매수 점수</span><span>'+Math.round(t.score*100)+'점</span></div>'+
        '<div class="detail-row"><span class="detail-label">보유기간</span><span>'+(t.sellYm-t.buyYm<=11?t.sellYm%100-t.buyYm%100+(t.sellYm%100>=t.buyYm%100?0:12):Math.floor((t.sellYm-t.buyYm)/100)*12+t.sellYm%100-t.buyYm%100)+'개월</span></div>'+
        featHtml+
      '</div>'+
    '</div>';
  }).join('');
  list.querySelectorAll('.tc-head').forEach(function(h){
    h.onclick=function(){
      var body = h.nextElementSibling;
      body.classList.toggle('open');
    };
  });
}

function renderAll(){ renderTimeline(); renderHoldings(); renderTrades(); }

// weights 로드
fetch('tools/learn/result/weights.json').then(function(r){return r.json();}).then(function(w){ window._weights=w; }).catch(function(){});

// 데이터 로드
fetch('tools/learn/result/trades.json').then(function(r){return r.json();}).then(function(d){
  DATA=d;
  // 최신 달 선택
  var yms=Object.keys(d.snapshots).sort();
  SEL_YM=yms[yms.length-1]||null;
  renderAll();
}).catch(function(){
  document.querySelector('main').innerHTML='<p style="color:var(--mut);padding:40px;text-align:center">데이터를 불러오지 못했어요. 로컬에서 열면 CORS 제한이 있을 수 있어요.</p>';
});
</script>
</body>
</html>
